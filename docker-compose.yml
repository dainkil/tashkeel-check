# 단계 1.5: 앱 1개 + Postgres(pgvector 이미지, M3 대비) 1개. `docker compose up --build`
# 앱은 .env를 읽는다(OPENAI_API_KEY, LLM_BACKEND, USE_MCP_TOOLS). DATABASE_URL은 여기서 db 서비스로 덮어쓴다.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tashkeel
      POSTGRES_PASSWORD: tashkeel
      POSTGRES_DB: tashkeel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tashkeel -d tashkeel"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://tashkeel:tashkeel@db:5432/tashkeel
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      DATA_DIR: /app/data
      RESULTS_DIR: /app/results
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
