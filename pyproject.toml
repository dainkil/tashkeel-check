[project]
name = "tashkeel-check"
version = "0.1.0"
description = "Single-agent apparatus that measures whether Arabic→English translation hides reading ambiguity"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "camel-tools>=1.6.0",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langsmith>=0.14.8",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
]

[project.scripts]
tashkeel = "tashkeel_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tashkeel_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a real OpenAI API key (skipped otherwise)",
    "camel: needs camel-tools and the calima-msa-r13 database",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["all_total_vue_student", "docs/market"]  # 제공 ZIP, 계산 기록 스크립트는 손대지 않는다

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tashkeel_check/prompts.py" = ["E501"]  # 프롬프트 원문은 LLM 입력이라 줄을 바꾸지 않는다(ADR-013)

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["camel_tools.*", "qdrant_client.*", "langchain_qdrant.*", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tashkeel_check"]
branch = true
