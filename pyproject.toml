[project]
name = "tashkeel-check"
version = "0.1.0"
description = "Single-agent apparatus that measures whether Arabic→English translation hides reading ambiguity"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "camel-tools>=1.6.0",
    "langchain>=1.4.5",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langsmith>=0.14.8",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
]

[project.scripts]
tashkeel = "tashkeel_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tashkeel_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a real OpenAI API key (skipped otherwise)",
    "camel: needs camel-tools and the calima-msa-r13 database",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
